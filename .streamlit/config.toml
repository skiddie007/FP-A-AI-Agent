[client]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[logger]
level = "info"

[client]
showErrorDetails = false
allowRunOnSave = true

[server]
proxy.streamlitServerAddress = "https://fpa-ai-agent.onrender.com"
proxy.headers = {"x-forwarded-proto" = "https", "x-forwarded-host" = "fpa-ai-agent.onrender.com"}

[theme]
primaryColor = "#1E88E5"  # Professional Blue
backgroundColor = "#0E1117"  # Dark background
secondaryBackgroundColor = "#1A1F2E"  # Slightly lighter dark
textColor = "#FAFAFA"  # High contrast white
font = "sans serif"  # Clean professional font
