[client]
gatherUsageStats = false
showErrorDetails = false
allowRunOnSave = true

[server]
headless = true
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

[logger]
level = "info"

[theme]
primaryColor = "#1E88E5"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2E"
textColor = "#FAFAFA"
font = "sans serif"
